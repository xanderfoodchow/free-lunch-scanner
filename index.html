<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Free Lunch Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 15px;
  background: #f5f5f5;
  color: #222;
}

h1 {
  margin: 8px 0 5px;
  font-size: 28px;
}

p {
  margin: 0 0 10px;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: 18px auto;
  background: white;
  padding: 10px;
  border-radius: 12px;
  overflow: hidden;
}

#result {
  width: 100%;
  max-width: 450px;
  margin: 18px auto;
  padding: 20px;
  border-radius: 12px;
  background: white;
  font-size: 20px;
  min-height: 90px;
}

.success {
  background: #d4edda !important;
  color: #155724;
}

.error {
  background: #f8d7da !important;
  color: #721c24;
}

.info {
  background: #fff3cd !important;
  color: #856404;
}

.name {
  font-size: 26px;
  font-weight: bold;
  margin: 10px 0;
}

.status {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
}

#cameraSelect,
#switchCamera {
  width: 100%;
  max-width: 450px;
  padding: 13px;
  margin: 5px auto 10px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

#switchCamera {
  cursor: pointer;
}

.count {
  max-width: 450px;
  margin: 10px auto;
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<h1>🍱 Free Lunch Scanner</h1>

<p>Scan Employee QR Code</p>

<select id="cameraSelect" style="display:none"></select>

<button id="switchCamera" style="display:none">
  🔄 Switch Camera
</button>

<div id="reader"></div>

<div id="result" class="info">
  📷 Starting camera...
</div>

<div id="scanCount" class="count">
  Successful claims this session: 0
</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw056MlHvMWgKzfm8KWXbhwHGA-qz1MHWsjP1M4wekvHTL64Qfg1PioHsQ601BeBCsr/exec";


let scanner = null;

let cameras = [];

let currentCameraIndex = 0;

let processing = false;

let scanCount = 0;

let callbackCounter = 0;


// =====================================
// SHOW RESULT
// =====================================

function showResult(message, type) {

  const el =
    document.getElementById("result");

  el.className = type;

  el.innerHTML = message;

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =====================================
// FIND CAMERAS
// =====================================

function getCameras() {

  showResult(
    "📷 Detecting cameras...",
    "info"
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.getCameras()

    .then(function(devices) {

      cameras = devices || [];


      if (cameras.length === 0) {

        showResult(

          "❌ NO CAMERA FOUND<br><br>" +
          "Please check your browser camera permission.",

          "error"

        );

        return;

      }


      populateCameraList();


      currentCameraIndex =
        findRearCameraIndex();


      document.getElementById(
        "cameraSelect"
      ).value =
        currentCameraIndex;


      startCamera(
        cameras[currentCameraIndex].id
      );

    })

    .catch(function(error) {

      showResult(

        "❌ CAMERA ERROR<br><br>" +
        escapeHtml(error),

        "error"

      );

    });

}


// =====================================
// FIND REAR CAMERA
// =====================================

function findRearCameraIndex() {

  const keywords = [

    "back",
    "rear",
    "environment"

  ];


  for (
    let i = 0;
    i < cameras.length;
    i++
  ) {

    const label =
      String(
        cameras[i].label || ""
      ).toLowerCase();


    for (
      let j = 0;
      j < keywords.length;
      j++
    ) {

      if (
        label.includes(
          keywords[j]
        )
      ) {

        return i;

      }

    }

  }


  // If browser does not provide
  // camera labels, use first camera.

  return 0;

}


// =====================================
// CAMERA LIST
// =====================================

function populateCameraList() {

  const select =
    document.getElementById(
      "cameraSelect"
    );


  select.innerHTML = "";


  cameras.forEach(
    function(camera, index) {

      const option =
        document.createElement(
          "option"
        );


      option.value = index;


      option.textContent =
        camera.label ||
        ("Camera " + (index + 1));


      select.appendChild(option);

    }
  );


  select.value =
    currentCameraIndex;


  if (cameras.length > 1) {

    select.style.display =
      "block";


    document.getElementById(
      "switchCamera"
    ).style.display =
      "block";

  }

}


// =====================================
// START CAMERA
// =====================================

function startCamera(cameraId) {

  processing = false;


  showResult(
    "📷 Starting camera...",
    "info"
  );


  scanner.start(

    cameraId,

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0,

      disableFlip: true

    },


    // QR FOUND
    function(decodedText) {

      if (processing) {

        return;

      }


      const employeeId =
        String(decodedText)
          .trim();


      if (!employeeId) {

        return;

      }


      processing = true;


      showResult(
        "⏳ Checking employee...",
        "info"
      );


      // IMPORTANT:
      // Camera is NOT stopped.

      claimEmployee(
        employeeId
      );

    },


    // Normal QR scan errors
    function(errorMessage) {

      // Ignore.

    }

  )

  .then(function() {

    showResult(
      "📷 Ready — Scan Employee QR",
      "info"
    );

  })

  .catch(function(error) {

    showResult(

      "❌ CAMERA ERROR<br><br>" +
      escapeHtml(error),

      "error"

    );

  });

}


// =====================================
// SEND CLAIM TO APPS SCRIPT
// =====================================

function claimEmployee(employeeId) {

  const callbackName =

    "claimCallback_" +
    Date.now() +
    "_" +
    (++callbackCounter);


  window[callbackName] =
    function(response) {

      try {

        handleResult(response);

      }

      finally {

        delete window[callbackName];


        const script =
          document.getElementById(
            callbackName
          );


        if (script) {

          script.remove();

        }

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =

    API_URL +

    "?action=claim" +

    "&employeeId=" +
    encodeURIComponent(
      employeeId
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      script.remove();


      handleError({

        message:
          "Unable to contact the lunch system."

      });

    };


  document.body.appendChild(
    script
  );

}


// =====================================
// HANDLE RESULT
// =====================================

function handleResult(response) {


  if (
    !response ||
    !response.status
  ) {

    handleError({

      message:
        "Invalid response from server."

    });

    return;

  }


  // ===================================
  // CLAIMED
  // ===================================

  if (
    response.status ===
    "CLAIMED"
  ) {

    scanCount++;

    updateScanCount();


    showResult(

      "🟢 " +
      "<div class='status'>" +
      "LUNCH CLAIMED" +
      "</div>" +

      "<div class='name'>" +
      escapeHtml(
        response.name
      ) +
      "</div>" +

      "<div>" +
      escapeHtml(
        response.employeeId
      ) +
      "</div>" +

      "<div>" +
      escapeHtml(
        response.time
      ) +
      "</div>",

      "success"

    );

  }


  // ===================================
  // ALREADY CLAIMED
  // ===================================

  else if (
    response.status ===
    "ALREADY_CLAIMED"
  ) {

    showResult(

      "🔴 " +
      "<div class='status'>" +
      "ALREADY CLAIMED" +
      "</div>" +

      "<div class='name'>" +
      escapeHtml(
        response.name
      ) +
      "</div>" +

      "<div>" +
      escapeHtml(
        response.employeeId
      ) +
      "</div>" +

      "<div>" +
      "Claimed at " +
      escapeHtml(
        response.time
      ) +
      "</div>",

      "error"

    );

  }


  // ===================================
  // NOT ELIGIBLE
  // ===================================

  else if (
    response.status ===
    "NOT_ELIGIBLE"
  ) {

    showResult(

      "🔴 " +
      "<div class='status'>" +
      "NOT ELIGIBLE" +
      "</div>" +

      "<div class='name'>" +
      escapeHtml(
        response.name
      ) +
      "</div>" +

      "<div>" +
      escapeHtml(
        response.message
      ) +
      "</div>",

      "error"

    );

  }


  // ===================================
  // NOT FOUND
  // ===================================

  else if (
    response.status ===
    "NOT_FOUND"
  ) {

    showResult(

      "❌ " +
      "<div class='status'>" +
      "EMPLOYEE NOT FOUND" +
      "</div>" +

      "<div>" +
      escapeHtml(
        response.employeeId
      ) +
      "</div>",

      "error"

    );

  }


  else {

    showResult(
      "⚠️ SYSTEM ERROR",
      "error"
    );

  }


  // ===================================
  // READY FOR NEXT EMPLOYEE
  // ===================================

  setTimeout(

    function() {

      processing = false;


      showResult(

        "📷 Ready — Scan Next Employee",

        "info"

      );

    },

    1800

  );

}


// =====================================
// HANDLE API ERROR
// =====================================

function handleError(error) {

  showResult(

    "⚠️ SYSTEM ERROR<br><br>" +

    escapeHtml(

      error &&
      error.message
        ? error.message
        : error

    ),

    "error"

  );


  setTimeout(

    function() {

      processing = false;


      showResult(

        "📷 Ready — Scan Next Employee",

        "info"

      );

    },

    1800

  );

}


// =====================================
// SCAN COUNTER
// =====================================

function updateScanCount() {

  document.getElementById(
    "scanCount"
  ).innerText =

    "Successful claims this session: " +
    scanCount;

}


// =====================================
// CAMERA DROPDOWN
// =====================================

document.getElementById(
  "cameraSelect"
)
.addEventListener(

  "change",

  function() {

    const index =
      Number(this.value);


    if (
      cameras[index]
    ) {

      switchCamera(
        index
      );

    }

  }

);


// =====================================
// SWITCH CAMERA BUTTON
// =====================================

document.getElementById(
  "switchCamera"
)
.addEventListener(

  "click",

  function() {

    if (
      cameras.length < 2
    ) {

      return;

    }


    currentCameraIndex =

      (
        currentCameraIndex +
        1
      ) %
      cameras.length;


    document.getElementById(
      "cameraSelect"
    ).value =
      currentCameraIndex;


    switchCamera(
      currentCameraIndex
    );

  }

);


// =====================================
// SWITCH CAMERA
// =====================================

function switchCamera(index) {

  if (
    !cameras[index]
  ) {

    return;

  }


  showResult(
    "🔄 Switching camera...",
    "info"
  );


  scanner.stop()

    .then(function() {

      return scanner.clear();

    })

    .then(function() {

      document.getElementById(
        "reader"
      ).innerHTML = "";


      scanner =
        new Html5Qrcode(
          "reader"
        );


      currentCameraIndex =
        index;


      startCamera(
        cameras[index].id
      );

    })

    .catch(function(error) {

      showResult(

        "❌ CAMERA ERROR<br><br>" +
        escapeHtml(error),

        "error"

      );

    });

}


// =====================================
// START
// =====================================

window.addEventListener(
  "load",
  function() {

    getCameras();

  }
);

</script>

</body>
</html>
