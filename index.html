<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Free Lunch Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }


    /* =========================
       SCANNER
    ========================= */

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }


    /* =========================
       RESULT / MEAL SECTION
    ========================= */

    #result,
    #mealSection {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
    }

    #result {
      background: white;
      font-size: 20px;
      min-height: 60px;
    }

    #mealSection {
      background: white;
      text-align: left;
      display: none;
    }


    /* =========================
       STATUS COLORS
    ========================= */

    .success {
      background: #d4edda !important;
      color: #155724 !important;
    }

    .error {
      background: #f8d7da !important;
      color: #721c24 !important;
    }

    .info {
      background: #fff3cd !important;
      color: #856404 !important;
    }


    /* =========================
       EMPLOYEE
    ========================= */

    .name {
      font-size: 24px;
      font-weight: bold;
      margin: 8px 0;
    }

    .status {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .employee-card {
      padding-bottom: 15px;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
    }

    .wallet {
      font-size: 24px;
      font-weight: bold;
      color: #28a745;
      margin-top: 12px;
    }


    /* =========================
       MEAL ITEM
    ========================= */

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 12px;
      margin-bottom: 10px;

      border: 1px solid #ddd;
      border-radius: 10px;

      background: white;
    }

    .meal-info {
      flex: 1;
      padding-right: 10px;
    }

    .meal-name {
      font-size: 17px;
      font-weight: bold;
    }

    .meal-price {
      color: #666;
      margin-top: 5px;
    }


    /* =========================
       QUANTITY CONTROL
    ========================= */

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-button {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 8px;

      font-size: 24px;
      font-weight: bold;

      cursor: pointer;

      background: #e9ecef;
    }

    .quantity-button:active {
      transform: scale(0.95);
    }

    .quantity {
      width: 30px;
      text-align: center;

      font-size: 20px;
      font-weight: bold;
    }


    /* =========================
       TOTAL
    ========================= */

    .total-section {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
    }


    /* =========================
       PROCEED BUTTON
    ========================= */

    .proceed-button {
      width: 100%;

      margin-top: 15px;
      padding: 15px;

      border: none;
      border-radius: 8px;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      background: #28a745;
      color: white;
    }

    .proceed-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }


    /* =========================
       MODAL
    ========================= */

    .modal {

      display: none;

      position: fixed;

      z-index: 9999;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background:
        rgba(0, 0, 0, 0.5);

      padding: 15px;

      overflow-y: auto;

    }


    .modal-content {

      background: white;

      max-width: 450px;

      margin: 50px auto;

      padding: 25px;

      border-radius: 15px;

      text-align: left;

    }


    .confirmation-row {

      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 8px 0;

      font-size: 17px;

    }


    .confirmation-buttons {

      display: flex;

      gap: 10px;

      margin-top: 25px;

    }


    .cancel-button,
    .confirm-button {

      flex: 1;

      padding: 15px;

      border: none;

      border-radius: 8px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .cancel-button {

      background: #ddd;

    }


    .confirm-button {

      background: #28a745;

      color: white;

    }

  </style>

</head>


<body>

  <h1>🍱 Free Lunch Scanner</h1>

  <p>Scan Employee QR Code</p>


  <!-- SCANNER -->

  <div id="reader"></div>


  <!-- RESULT -->

  <div id="result" class="info">

    📷 Starting camera...

  </div>


  <!-- MEAL SECTION -->

  <div id="mealSection">


    <!-- EMPLOYEE -->

    <div class="employee-card">

      <div
        id="employeeName"
        class="name">
      </div>


      <div id="employeeId"></div>

      <div id="department"></div>


      <div class="wallet">

        Wallet: ₱<span id="walletBalance">

          0.00

        </span>

      </div>

    </div>


    <h3>🍽 Select Meal(s)</h3>


    <!-- MEALS -->

    <div id="mealList"></div>


    <!-- TOTAL -->

    <div class="total-section">

      <div class="total">

        Total:

        ₱<span id="mealTotal">

          0.00

        </span>

      </div>


      <button
        id="proceedButton"
        class="proceed-button"
        disabled>

        PROCEED

      </button>

    </div>

  </div>



  <!-- =========================
       CONFIRMATION MODAL
  ========================== -->

  <div
    id="confirmationModal"
    class="modal">


    <div class="modal-content">


      <h2>🧾 Confirm Order</h2>


      <div id="confirmationEmployee"></div>


      <hr>


      <div id="confirmationMeals"></div>


      <hr>


      <div class="confirmation-row">

        <span>Total:</span>

        <strong id="confirmationTotal">

          ₱0.00

        </strong>

      </div>


      <div class="confirmation-row">

        <span>Wallet Balance:</span>

        <strong id="confirmationWallet">

          ₱0.00

        </strong>

      </div>


      <div class="confirmation-row">

        <span>Wallet Used:</span>

        <strong id="confirmationWalletUsed">

          ₱0.00

        </strong>

      </div>


      <div
        id="confirmationCashRow"
        class="confirmation-row">

        <span>Cash Required:</span>

        <strong id="confirmationCash">

          ₱0.00

        </strong>

      </div>


      <div class="confirmation-buttons">


        <button
          id="cancelConfirmButton"
          class="cancel-button">

          CANCEL

        </button>


        <button
          id="confirmButton"
          class="confirm-button">

          CONFIRM ORDER

        </button>


      </div>


    </div>

  </div>



  
<script>

// =====================================
// API URL
// =====================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbw056MlHvMWgKzfm8KWXbhwHGA-qz1MHWsjP1M4wekvHTL64Qfg1PioHsQ601BeBCsr/exec";


// =====================================
// VARIABLES
// =====================================

let scanner = null;

let processing = false;

let currentEmployee = null;

let availableMeals = [];

let mealQuantities = {};

let pendingMeals = [];


// =====================================
// SOUND SYSTEM
// =====================================

let audioContext = null;


// -------------------------------------
// INITIALIZE AUDIO
// -------------------------------------

function initializeAudio() {

  try {

    if (!audioContext) {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) {

        console.log(
          "Web Audio API is not supported."
        );

        return null;

      }

      audioContext =
        new AudioContext();

    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

    return audioContext;

  }

  catch (error) {

    console.log(
      "Audio initialization error:",
      error
    );

    return null;

  }

}


// -------------------------------------
// PLAY TONE
// -------------------------------------

function playTone(
  frequency,
  duration,
  volume,
  type = "sine",
  delay = 0
) {

  const ctx =
    initializeAudio();

  if (!ctx) {

    return;

  }

  try {

    const startTime =
      ctx.currentTime + delay;

    const oscillator =
      ctx.createOscillator();

    const gainNode =
      ctx.createGain();


    oscillator.type =
      type;


    oscillator.frequency.setValueAtTime(
      frequency,
      startTime
    );


    gainNode.gain.setValueAtTime(
      0.001,
      startTime
    );


    gainNode.gain.exponentialRampToValueAtTime(
      volume,
      startTime + 0.01
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.001,
      startTime + duration
    );


    oscillator.connect(
      gainNode
    );

    gainNode.connect(
      ctx.destination
    );


    oscillator.start(
      startTime
    );


    oscillator.stop(
      startTime + duration + 0.02
    );

  }

  catch (error) {

    console.log(
      "Tone error:",
      error
    );

  }

}


// =====================================
// 🔊 QR SCANNED BEEP
// =====================================

function playScanBeep() {

  playTone(
    1000,
    0.12,
    0.25,
    "sine"
  );

}


// =====================================
// ✅ SUCCESS SOUND
// =====================================

function playSuccessSound() {

  playTone(
    800,
    0.12,
    0.25,
    "sine",
    0
  );

  playTone(
    1200,
    0.18,
    0.30,
    "sine",
    0.13
  );

}


// =====================================
// ❌ ERROR SOUND
// =====================================

function playErrorSound() {

  playTone(
    500,
    0.18,
    0.30,
    "square",
    0
  );

  playTone(
    350,
    0.25,
    0.30,
    "square",
    0.20
  );

}


// =====================================
// 🚫 WARNING SOUND
// =====================================

function playWarningSound() {

  playTone(
    650,
    0.18,
    0.30,
    "triangle",
    0
  );

  playTone(
    650,
    0.18,
    0.30,
    "triangle",
    0.24
  );

  playTone(
    400,
    0.30,
    0.30,
    "triangle",
    0.48
  );

}


// =====================================
// SHOW RESULT
// =====================================

function showResult(
  message,
  type
) {

  const result =
    document.getElementById(
      "result"
    );

  result.className =
    type;

  result.innerHTML =
    message;

}


// =====================================
// JSONP REQUEST
// =====================================

function apiRequest(
  url,
  successCallback,
  errorCallback
) {

  const callbackName =
    "lunchCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 10000
    );


  window[callbackName] =
    function(response) {

      try {

        successCallback(
          response
        );

      }

      finally {

        delete window[
          callbackName
        ];


        const script =
          document.getElementById(
            callbackName
          );


        if (script) {

          script.remove();

        }

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    url +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      script.remove();


      if (errorCallback) {

        errorCallback({

          message:
            "Unable to contact the lunch system."

        });

      }

    };


  document.body.appendChild(
    script
  );

}


// =====================================
// START SCANNER
// =====================================

function startScanner() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    playErrorSound();

    showResult(
      "❌ Scanner library failed to load.",
      "error"
    );

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },


    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0

    },


    function(decodedText) {


      if (processing) {

        return;

      }


      let employeeId = "";


      try {

        const qrUrl =
          new URL(
            decodedText
          );


        employeeId =
          qrUrl.searchParams.get(
            "claim"
          ) || "";

      }

      catch (error) {

        employeeId =
          decodedText;

      }


      employeeId =
        String(
          employeeId
        )
        .trim()
        .toUpperCase();


      // =====================================
      // INVALID QR
      // =====================================

      if (!employeeId) {

        playErrorSound();

        showResult(

          "❌ INVALID EMPLOYEE QR",

          "error"

        );

        return;

      }


      // =====================================
      // QR SUCCESSFULLY SCANNED
      // =====================================

      processing =
        true;


      // 🔊 BEEP
      playScanBeep();


      showResult(

        "⏳ Checking employee...<br><br>" +

        "<b>" +

        employeeId +

        "</b>",

        "info"

      );


      getEmployeeData(
        employeeId
      );

    },


    function(errorMessage) {

      // Ignore normal scanning errors

    }

  )


  .then(function() {

    showResult(

      "📷 READY — SCAN NEXT EMPLOYEE",

      "info"

    );

  })


  .catch(function(error) {

    console.error(
      error
    );


    playErrorSound();


    showResult(

      "❌ CAMERA ERROR<br><br>" +

      error,

      "error"

    );

  });

}


// =====================================
// GET EMPLOYEE DATA
// =====================================

function getEmployeeData(
  employeeId
) {

  const url =
    API_URL +
    "?action=employeeData" +
    "&employeeId=" +
    encodeURIComponent(
      employeeId
    );


  apiRequest(

    url,


    function(response) {

      handleEmployeeData(
        response
      );

    },


    function(error) {

      handleError(
        error
      );

    }

  );

}


// =====================================
// HANDLE EMPLOYEE DATA
// =====================================

function handleEmployeeData(
  response
) {

  console.log(
    "EMPLOYEE DATA:",
    response
  );


  // =====================================
  // EMPLOYEE NOT FOUND
  // =====================================

  if (
    response.status !==
    "SUCCESS"
  ) {

    playErrorSound();


    showResult(

      "❌ EMPLOYEE NOT FOUND",

      "error"

    );


    setTimeout(
      resetForNextEmployee,
      3000
    );

    return;

  }


  currentEmployee =
    response.employee;


  availableMeals =
    response.meals || [];


  mealQuantities =
    {};


  // =====================================
  // EMPLOYEE INFO
  // =====================================

  document.getElementById(
    "employeeName"
  ).innerText =
    currentEmployee.name;


  document.getElementById(
    "employeeId"
  ).innerText =
    currentEmployee.employeeId;


  document.getElementById(
    "department"
  ).innerText =
    currentEmployee.department;


  // =====================================
  // WALLET
  // =====================================

  const remainingBalance =
    Number(
      response.wallet.remainingBalance
    ) || 0;


  document.getElementById(
    "walletBalance"
  ).innerText =
    remainingBalance.toFixed(2);


  // =====================================
  // 🚫 WALLET FULLY CONSUMED
  // =====================================

  if (
    remainingBalance <= 0
  ) {

    document.getElementById(
      "mealSection"
    ).style.display =
      "none";


    // 🚫 WARNING SOUND
    playWarningSound();


    showResult(

      "🔴" +

      "<div class='status'>" +

      "WALLET FULLY CONSUMED" +

      "</div>" +

      "<div class='name'>" +

      currentEmployee.name +

      "</div>" +

      "<br>" +

      "<div>" +

      "Today's lunch wallet has already been used." +

      "</div>" +

      "<br>" +

      "<div>" +

      "Remaining Balance: " +

      "<b>₱0.00</b>" +

      "</div>",

      "error"

    );


    setTimeout(
      resetForNextEmployee,
      4000
    );


    return;

  }


  // =====================================
  // RENDER MEALS
  // =====================================

  renderMeals();


  document.getElementById(
    "mealSection"
  ).style.display =
    "block";


  // =====================================
  // ✅ EMPLOYEE VERIFIED
  // =====================================

  playSuccessSound();


  showResult(

    "✅ EMPLOYEE VERIFIED<br>" +

    "Select meal(s).",

    "success"

  );

}


// =====================================
// RENDER MEALS
// =====================================

function renderMeals() {

  const mealList =
    document.getElementById(
      "mealList"
    );


  mealList.innerHTML =
    "";


  availableMeals.forEach(
    function(meal) {


      mealQuantities[
        meal.mealId
      ] = 0;


      const mealItem =
        document.createElement(
          "div"
        );


      mealItem.className =
        "meal-item";


      mealItem.innerHTML =

        "<div class='meal-info'>" +

          "<div class='meal-name'>" +

            meal.name +

          "</div>" +

          "<div class='meal-price'>" +

            "₱" +

            Number(
              meal.price
            ).toFixed(2) +

          "</div>" +

        "</div>" +

        "<div class='quantity-control'>" +

          "<button " +

            "class='quantity-button decrease-button' " +

            "data-id='" +

            meal.mealId +

            "'>" +

            "−" +

          "</button>" +

          "<div " +

            "class='quantity' " +

            "id='qty-" +

            meal.mealId +

            "'>" +

            "0" +

          "</div>" +

          "<button " +

            "class='quantity-button increase-button' " +

            "data-id='" +

            meal.mealId +

            "'>" +

            "+" +

          "</button>" +

        "</div>";


      mealList.appendChild(
        mealItem
      );

    }

  );


  // =====================================
  // PLUS BUTTON
  // =====================================

  document
    .querySelectorAll(
      ".increase-button"
    )
    .forEach(
      function(button) {

        button.addEventListener(

          "click",

          function() {

            const mealId =
              button.dataset.id;


            mealQuantities[
              mealId
            ]++;


            updateQuantityDisplay(
              mealId
            );


            updateTotal();

          }

        );

      }

    );


  // =====================================
  // MINUS BUTTON
  // =====================================

  document
    .querySelectorAll(
      ".decrease-button"
    )
    .forEach(
      function(button) {

        button.addEventListener(

          "click",

          function() {

            const mealId =
              button.dataset.id;


            if (
              mealQuantities[
                mealId
              ] > 0
            ) {

              mealQuantities[
                mealId
              ]--;

            }


            updateQuantityDisplay(
              mealId
            );


            updateTotal();

          }

        );

      }

    );


  updateTotal();

}


// =====================================
// UPDATE QUANTITY DISPLAY
// =====================================

function updateQuantityDisplay(
  mealId
) {

  const quantityElement =
    document.getElementById(
      "qty-" +
      mealId
    );


  if (
    quantityElement
  ) {

    quantityElement.innerText =
      mealQuantities[
        mealId
      ];

  }

}


// =====================================
// UPDATE TOTAL
// =====================================

function updateTotal() {

  let total = 0;

  let selectedCount = 0;


  availableMeals.forEach(
    function(meal) {

      const quantity =
        Number(
          mealQuantities[
            meal.mealId
          ]
        ) || 0;


      if (
        quantity > 0
      ) {

        total +=

          Number(
            meal.price
          ) *

          quantity;


        selectedCount +=
          quantity;

      }

    }

  );


  document.getElementById(
    "mealTotal"
  ).innerText =
    total.toFixed(2);


  document.getElementById(
    "proceedButton"
  ).disabled =
    selectedCount === 0;

}


// =====================================
// PROCEED BUTTON
// =====================================

document.getElementById(
  "proceedButton"
).addEventListener(

  "click",

  function() {

    if (!currentEmployee) {

      return;

    }


    pendingMeals = [];


    availableMeals.forEach(
      function(meal) {

        const quantity =
          Number(
            mealQuantities[
              meal.mealId
            ]
          ) || 0;


        if (
          quantity > 0
        ) {

          pendingMeals.push({

            mealId:
              meal.mealId,

            name:
              meal.name,

            price:
              Number(
                meal.price
              ),

            quantity:
              quantity

          });

        }

      }

    );


    if (
      pendingMeals.length === 0
    ) {

      return;

    }


    // =====================================
    // CALCULATE TOTAL
    // =====================================

    let totalAmount = 0;


    pendingMeals.forEach(
      function(meal) {

        totalAmount +=

          Number(
            meal.price
          ) *

          Number(
            meal.quantity
          );

      }

    );


    // =====================================
    // WALLET
    // =====================================

    const walletBalance =
      Number(
        document.getElementById(
          "walletBalance"
        ).innerText
      ) || 0;


    const walletUsed =
      Math.min(
        walletBalance,
        totalAmount
      );


    const cashRequired =
      Math.max(
        totalAmount -
        walletUsed,
        0
      );


    // =====================================
    // EMPLOYEE
    // =====================================

    document.getElementById(
      "confirmationEmployee"
    ).innerHTML =

      "<strong>" +

      currentEmployee.name +

      "</strong><br>" +

      currentEmployee.employeeId;


    // =====================================
    // SELECTED MEALS
    // =====================================

    let mealsHtml = "";


    pendingMeals.forEach(
      function(meal) {

        const subtotal =

          Number(
            meal.price
          ) *

          Number(
            meal.quantity
          );


        mealsHtml +=

          "<div class='confirmation-row'>" +

            "<span>" +

              meal.name +

              " × " +

              meal.quantity +

            "</span>" +

            "<strong>" +

              "₱" +

              subtotal.toFixed(2) +

            "</strong>" +

          "</div>";

      }

    );


    document.getElementById(
      "confirmationMeals"
    ).innerHTML =
      mealsHtml;


    // =====================================
    // PAYMENT SUMMARY
    // =====================================

    document.getElementById(
      "confirmationTotal"
    ).innerText =

      "₱" +

      totalAmount.toFixed(2);


    document.getElementById(
      "confirmationWallet"
    ).innerText =

      "₱" +

      walletBalance.toFixed(2);


    document.getElementById(
      "confirmationWalletUsed"
    ).innerText =

      "₱" +

      walletUsed.toFixed(2);


    document.getElementById(
      "confirmationCash"
    ).innerText =

      "₱" +

      cashRequired.toFixed(2);


    // =====================================
    // CASH DISPLAY
    // =====================================

    document.getElementById(
      "confirmationCashRow"
    ).style.display =

      cashRequired > 0

        ? "flex"

        : "none";


    // =====================================
    // SHOW MODAL
    // =====================================

    document.getElementById(
      "confirmationModal"
    ).style.display =
      "block";

  }

);


// =====================================
// CANCEL ORDER
// =====================================

document.getElementById(
  "cancelConfirmButton"
).addEventListener(

  "click",

  function() {

    document.getElementById(
      "confirmationModal"
    ).style.display =
      "none";


    pendingMeals =
      [];

  }

);


// =====================================
// CONFIRM ORDER
// =====================================

document.getElementById(
  "confirmButton"
).addEventListener(

  "click",

  function() {

    if (
      !currentEmployee ||
      pendingMeals.length === 0
    ) {

      return;

    }


    document.getElementById(
      "confirmButton"
    ).disabled =
      true;


    document.getElementById(
      "confirmButton"
    ).innerText =
      "PROCESSING...";


    processTransaction(

      currentEmployee.employeeId,

      pendingMeals

    );

  }

);


// =====================================
// PROCESS TRANSACTION
// =====================================

function processTransaction(
  employeeId,
  selectedMeals
) {

  const url =

    API_URL +

    "?action=transaction" +

    "&employeeId=" +

    encodeURIComponent(
      employeeId
    ) +

    "&meals=" +

    encodeURIComponent(

      JSON.stringify(
        selectedMeals
      )

    );


  apiRequest(

    url,


    function(response) {

      handleTransactionResult(
        response
      );

    },


    function(error) {

      handleTransactionError(
        error
      );

    }

  );

}


// =====================================
// TRANSACTION RESULT
// =====================================

function handleTransactionResult(
  response
) {

  document.getElementById(
    "confirmationModal"
  ).style.display =
    "none";


  // =====================================
  // TRANSACTION ERROR
  // =====================================

  if (
    response.status !==
    "SUCCESS"
  ) {

    playErrorSound();


    showResult(

      "⚠️ SYSTEM ERROR<br><br>" +

      (
        response.message ||
        "Unable to process transaction."
      ),

      "error"

    );


    setTimeout(
      resetForNextEmployee,
      3000
    );

    return;

  }


  // =====================================
  // SUCCESSFUL TRANSACTION
  // =====================================

  playSuccessSound();


  let paymentMessage = "";


  if (
    Number(
      response.cashRequired
    ) === 0
  ) {

    paymentMessage =
      "💳 Paid using Wallet";

  }

  else {

    paymentMessage =

      "💳 Wallet Used: ₱" +

      Number(
        response.walletUsed
      ).toFixed(2) +

      "<br><br>" +

      "💵 Cash Required: <b>₱" +

      Number(
        response.cashRequired
      ).toFixed(2) +

      "</b>";

  }


  showResult(

    "🟢" +

    "<div class='status'>" +

      "TRANSACTION COMPLETE" +

    "</div>" +

    "<div class='name'>" +

      response.employee.name +

    "</div>" +

    "<br>" +

    "<div>" +

      "Total: ₱" +

      Number(
        response.totalAmount
      ).toFixed(2) +

    "</div>" +

    "<br>" +

    "<div>" +

      paymentMessage +

    "</div>" +

    "<br>" +

    "<div>" +

      "Remaining Wallet: <b>₱" +

      Number(
        response.remainingBalance
      ).toFixed(2) +

      "</b>" +

    "</div>",

    "success"

  );


  document.getElementById(
    "mealSection"
  ).style.display =
    "none";


  setTimeout(
    resetForNextEmployee,
    5000
  );

}


// =====================================
// TRANSACTION ERROR
// =====================================

function handleTransactionError(
  error
) {

  document.getElementById(
    "confirmationModal"
  ).style.display =
    "none";


  playErrorSound();


  showResult(

    "⚠️ SYSTEM ERROR<br><br>" +

    (
      error.message ||
      "Unable to process transaction."
    ),

    "error"

  );


  document.getElementById(
    "confirmButton"
  ).disabled =
    false;


  document.getElementById(
    "confirmButton"
  ).innerText =
    "CONFIRM ORDER";

}


// =====================================
// GENERAL ERROR
// =====================================

function handleError(
  error
) {

  document.getElementById(
    "mealSection"
  ).style.display =
    "none";


  playErrorSound();


  showResult(

    "⚠️ SYSTEM ERROR<br><br>" +

    (
      error.message ||
      "Unable to retrieve employee."
    ),

    "error"

  );


  setTimeout(
    resetForNextEmployee,
    3000
  );

}


// =====================================
// RESET
// =====================================

function resetForNextEmployee() {

  currentEmployee =
    null;


  availableMeals =
    [];


  mealQuantities =
    {};


  pendingMeals =
    [];


  document.getElementById(
    "mealSection"
  ).style.display =
    "none";


  document.getElementById(
    "confirmationModal"
  ).style.display =
    "none";


  document.getElementById(
    "mealList"
  ).innerHTML =
    "";


  document.getElementById(
    "mealTotal"
  ).innerText =
    "0.00";


  document.getElementById(
    "proceedButton"
  ).disabled =
    true;


  document.getElementById(
    "confirmButton"
  ).disabled =
    false;


  document.getElementById(
    "confirmButton"
  ).innerText =
    "CONFIRM ORDER";


  processing =
    false;


  showResult(

    "📷 READY — SCAN NEXT EMPLOYEE",

    "info"

  );

}


// =====================================
// START
// =====================================

window.onload =
  function() {

    startScanner();

  };

</script>
