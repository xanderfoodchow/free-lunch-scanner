<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Lunch Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
      box-sizing: border-box;
    }

    #result {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      background: #fff3cd;
      color: #856404;
      font-size: 20px;
      box-sizing: border-box;
    }

    .success {
      background: #d4edda !important;
      color: #155724 !important;
    }

    .error {
      background: #f8d7da !important;
      color: #721c24 !important;
    }

    .info {
      background: #fff3cd !important;
      color: #856404 !important;
    }

    .name {
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0;
    }

    .status {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<h1>🍱 Free Lunch Scanner</h1>
<p>Scan Employee QR Code</p>

<div id="reader"></div>

<div id="result" class="info">
  📷 Camera is starting...
</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw056MlHvMWgKzfm8KWXbhwHGA-qz1MHWsjP1M4wekvHTL64Qfg1PioHsQ601BeBCsr/exec";

let scanner = null;
let processing = false;


// =====================================
// SHOW RESULT
// =====================================

function showResult(message, type) {

  const result =
    document.getElementById("result");

  result.className = type;
  result.innerHTML = message;
}


// =====================================
// START SCANNER
// =====================================

function startScanner() {

  if (typeof Html5Qrcode === "undefined") {

    showResult(
      "❌ Scanner library failed to load.<br><br>" +
      "Please check your internet connection.",
      "error"
    );

    return;
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      aspectRatio: 1.0
    },

    function(decodedText) {

      if (processing) {
        return;
      }

      console.log("RAW QR:", decodedText);

      let employeeId = "";

      // =====================================
      // EXTRACT CLAIM FROM QR URL
      // =====================================

      try {

        const qrUrl =
          new URL(decodedText);

        employeeId =
          qrUrl.searchParams.get("claim") || "";

      } catch (error) {

        // Also support QR containing only:
        // FC-00011

        employeeId =
          decodedText;

      }

      employeeId =
        String(employeeId)
          .trim()
          .toUpperCase();

      console.log(
        "EMPLOYEE ID:",
        employeeId
      );

      if (!employeeId) {

        showResult(
          "❌ INVALID EMPLOYEE QR",
          "error"
        );

        return;
      }

      processing = true;

      showResult(

        "⏳ Checking employee...<br><br>" +
        "<b>" +
        employeeId +
        "</b>",

        "info"

      );

      claimEmployee(employeeId);

    },

    function(errorMessage) {

      // Normal scanning errors are ignored.

    }

  )

  .then(function() {

    showResult(
      "📷 READY — SCAN EMPLOYEE QR",
      "info"
    );

  })

  .catch(function(error) {

    console.error(
      "CAMERA ERROR:",
      error
    );

    showResult(

      "❌ CAMERA ERROR<br><br>" +
      error,

      "error"

    );

  });

}


// =====================================
// CONTACT APPS SCRIPT
// =====================================

function claimEmployee(employeeId) {

  const callbackName =
    "lunchCallback_" +
    Date.now();

  window[callbackName] =
    function(response) {

      try {

        handleResult(response);

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }

      }

    };


  const script =
    document.createElement("script");

  script.id =
    callbackName;

  script.src =
    API_URL +
    "?action=claim" +
    "&employeeId=" +
    encodeURIComponent(employeeId) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      handleError({
        message:
          "Unable to contact the lunch system."
      });

    };


  document.body.appendChild(script);

}


// =====================================
// HANDLE RESULT
// =====================================

function handleResult(response) {

  console.log(
    "API RESPONSE:",
    response
  );

  if (response.status === "CLAIMED") {

    showResult(

      "🟢" +
      "<div class='status'>LUNCH CLAIMED</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>" +

      "<div>" +
      response.time +
      "</div>",

      "success"
    );

  }

  else if (
    response.status === "ALREADY_CLAIMED"
  ) {

    showResult(

      "🔴" +
      "<div class='status'>ALREADY CLAIMED</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>" +

      "<div>Claimed at " +
      response.time +
      "</div>",

      "error"
    );

  }

  else if (
    response.status === "NOT_ELIGIBLE"
  ) {

    showResult(

      "🔴" +
      "<div class='status'>NOT ELIGIBLE</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.message +
      "</div>",

      "error"
    );

  }

  else if (
    response.status === "NOT_FOUND"
  ) {

    showResult(

      "❌" +
      "<div class='status'>EMPLOYEE NOT FOUND</div>" +

      "<div>" +
      response.employeeId +
      "</div>",

      "error"
    );

  }

  else {

    showResult(

      "⚠️" +
      "<div class='status'>SYSTEM ERROR</div>" +

      "<div>" +
      (
        response.message ||
        "Unexpected response."
      ) +
      "</div>",

      "error"
    );

  }

  setTimeout(function() {

    processing = false;

    showResult(
      "📷 READY — SCAN NEXT EMPLOYEE",
      "info"
    );

  }, 3000);

}


// =====================================
// CONNECTION ERROR
// =====================================

function handleError(error) {

  showResult(

    "⚠️" +
    "<div class='status'>SYSTEM ERROR</div>" +

    "<div>" +
    error.message +
    "</div>",

    "error"
  );

  setTimeout(function() {

    processing = false;

    showResult(
      "📷 READY — SCAN NEXT EMPLOYEE",
      "info"
    );

  }, 3000);

}


// =====================================
// START
// =====================================

window.onload = function() {

  startScanner();

};

</script>

</body>
</html>
