<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Free Lunch Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
      box-sizing: border-box;
    }

    #result {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      background: white;
      font-size: 20px;
      box-sizing: border-box;
    }

    .success {
      background: #d4edda !important;
      color: #155724;
    }

    .error {
      background: #f8d7da !important;
      color: #721c24;
    }

    .info {
      background: #fff3cd !important;
      color: #856404;
    }

    .name {
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0;
    }

    .status {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>🍱 Free Lunch Scanner</h1>

  <p>Scan Employee QR Code</p>

  <div id="reader"></div>

  <div id="result" class="info">
    📷 Camera is starting...
  </div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw056MlHvMWgKzfm8KWXbhwHGA-qz1MHWsjP1M4wekvHTL64Qfg1PioHsQ601BeBCsr/exec";


let scanner = null;

let processing = false;


// =====================================
// SHOW RESULT
// =====================================

function showResult(message, type) {

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = message;

}


// =====================================
// START SCANNER
// =====================================

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },


    // =================================
    // QR DETECTED
    // =================================

 function(decodedText) {

  if (processing) {
    return;
  }

  // =====================================
  // EXTRACT EMPLOYEE ID FROM QR
  // =====================================

  let employeeId = '';

  try {

    const scannedUrl =
      new URL(decodedText);

    // QR format:
    // https://.../exec?claim=FC-00011

    employeeId =
      String(
        scannedUrl.searchParams.get('claim') || ''
      ).trim();

  } catch (error) {

    // Support QR containing plain ID
    // Example: FC-00011

    employeeId =
      String(decodedText).trim();

  }


  // =====================================
  // INVALID QR
  // =====================================

  if (!employeeId) {

    showResult(
      "❌ Invalid Employee QR Code",
      "error"
    );

    return;

  }


  processing = true;


  // =====================================
  // SHOW CHECKING
  // =====================================

  showResult(

    "⏳ Checking employee...<br><br>" +
    "<b>" +
    employeeId +
    "</b>",

    "info"

  );


  // =====================================
  // SEND ONLY EMPLOYEE ID
  // =====================================

  claimEmployee(employeeId);

},


    // Normal scanning errors
    function(errorMessage) {

      // Ignore normal scan errors.

    }

  )

  .then(function() {

    showResult(

      "📷 Ready — Scan Employee QR",

      "info"

    );

  })

  .catch(function(error) {

    showResult(

      "❌ CAMERA ERROR<br><br>" +
      error,

      "error"

    );

  });

}


// =====================================
// CONTACT APPS SCRIPT API
// =====================================

function claimEmployee(employeeId) {

  const callbackName =
    "lunchCallback_" +
    Date.now();

  window[callbackName] =
    function(response) {

      try {

        handleResult(response);

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }

      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?action=claim" +
    "&employeeId=" +
    encodeURIComponent(
      employeeId
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      handleError({
        message:
          "Unable to contact the lunch system."
      });

    };


  document.body.appendChild(
    script
  );

}


// =====================================
// HANDLE API RESULT
// =====================================

function handleResult(response) {


  // ===================================
  // CLAIMED
  // ===================================

  if (
    response.status === "CLAIMED"
  ) {

    showResult(

      "🟢 " +

      "<div class='status'>" +
      "LUNCH CLAIMED" +
      "</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>" +

      "<div>" +
      response.time +
      "</div>",

      "success"

    );

  }


  // ===================================
  // ALREADY CLAIMED
  // ===================================

  else if (
    response.status ===
    "ALREADY_CLAIMED"
  ) {

    showResult(

      "🔴 " +

      "<div class='status'>" +
      "ALREADY CLAIMED" +
      "</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>" +

      "<div>" +
      "Claimed at " +
      response.time +
      "</div>",

      "error"

    );

  }


  // ===================================
  // NOT ELIGIBLE
  // ===================================

  else if (
    response.status ===
    "NOT_ELIGIBLE"
  ) {

    showResult(

      "🔴 " +

      "<div class='status'>" +
      "NOT ELIGIBLE" +
      "</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.message +
      "</div>",

      "error"

    );

  }


  // ===================================
  // NOT FOUND
  // ===================================

  else if (
    response.status ===
    "NOT_FOUND"
  ) {

    showResult(

      "❌ " +

      "<div class='status'>" +
      "EMPLOYEE NOT FOUND" +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>",

      "error"

    );

  }


  // ===================================
  // ERROR
  // ===================================

  else {

    showResult(

      "⚠️ " +
      "<div class='status'>" +
      "SYSTEM ERROR" +
      "</div>" +

      "<div>" +
      (response.message ||
       "Unexpected response.") +
      "</div>",

      "error"

    );

  }


  // ===================================
  // READY FOR NEXT EMPLOYEE
  // ===================================

  setTimeout(function() {

    processing = false;


    showResult(

      "📷 Ready — Scan Next Employee",

      "info"

    );

  }, 2000);

}


// =====================================
// HANDLE CONNECTION ERROR
// =====================================

function handleError(error) {

  showResult(

    "⚠️ " +

    "<div class='status'>" +
    "SYSTEM ERROR" +
    "</div>" +

    "<div>" +
    error.message +
    "</div>",

    "error"

  );


  setTimeout(function() {

    processing = false;


    showResult(

      "📷 Ready — Scan Next Employee",

      "info"

    );

  }, 3000);

}


// =====================================
// START
// =====================================

window.onload = function() {

  startScanner();

};

</script>

</body>
</html>
