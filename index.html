<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Free Lunch Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
      box-sizing: border-box;
    }

    #result {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      background: white;
      font-size: 20px;
      box-sizing: border-box;
    }

    .success {
      background: #d4edda !important;
      color: #155724;
    }

    .error {
      background: #f8d7da !important;
      color: #721c24;
    }

    .info {
      background: #fff3cd !important;
      color: #856404;
    }

    .name {
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0;
    }

    .status {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>🍱 Free Lunch Scanner</h1>

  <p>Scan Employee QR Code</p>

  <div id="reader"></div>

  <div id="result" class="info">
    📷 Camera is starting...
  </div>


<script>

let scanner = null;

let processing = false;


// =====================================
// SHOW RESULT
// =====================================

function showResult(message, type) {

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = message;

}


// =====================================
// START SCANNER
// =====================================

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },


    // =================================
    // QR CODE DETECTED
    // =================================

    function(decodedText) {

      // Prevent multiple reads
      // of the same QR.

      if (processing) {
        return;
      }


      processing = true;


      const employeeId =
        String(decodedText).trim();


      showResult(

        "⏳ Checking employee...<br><br>" +
        "<b>" +
        employeeId +
        "</b>",

        "info"

      );


      // =================================
      // DO NOT STOP CAMERA
      // =================================
      //
      // This is what makes it continuous.
      //
      // Camera stays running while
      // Apps Script processes the claim.
      //

      google.script.run

        .withSuccessHandler(
          handleResult
        )

        .withFailureHandler(
          handleError
        )

        .processLunchClaim(
          employeeId
        );

    },


    // =================================
    // NORMAL QR SCANNING ERRORS
    // =================================

    function(errorMessage) {

      // Ignore normal scanning errors.

    }

  )


  .then(function() {

    showResult(

      "📷 Ready — Scan Employee QR",

      "info"

    );

  })


  .catch(function(error) {

    showResult(

      "❌ CAMERA ERROR<br><br>" +
      error,

      "error"

    );

  });

}


// =====================================
// HANDLE RESULT
// =====================================

function handleResult(response) {


  // ===================================
  // CLAIMED
  // ===================================

  if (
    response.status === "CLAIMED"
  ) {

    showResult(

      "🟢 " +

      "<div class='status'>" +
      "LUNCH CLAIMED" +
      "</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>" +

      "<div>" +
      response.time +
      "</div>",

      "success"

    );

  }


  // ===================================
  // ALREADY CLAIMED
  // ===================================

  else if (
    response.status ===
    "ALREADY_CLAIMED"
  ) {

    showResult(

      "🔴 " +

      "<div class='status'>" +
      "ALREADY CLAIMED" +
      "</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>" +

      "<div>" +
      "Claimed at " +
      response.time +
      "</div>",

      "error"

    );

  }


  // ===================================
  // NOT ELIGIBLE
  // ===================================

  else if (
    response.status ===
    "NOT_ELIGIBLE"
  ) {

    showResult(

      "🔴 " +

      "<div class='status'>" +
      "NOT ELIGIBLE" +
      "</div>" +

      "<div class='name'>" +
      response.name +
      "</div>" +

      "<div>" +
      response.message +
      "</div>",

      "error"

    );

  }


  // ===================================
  // NOT FOUND
  // ===================================

  else if (
    response.status ===
    "NOT_FOUND"
  ) {

    showResult(

      "❌ " +

      "<div class='status'>" +
      "EMPLOYEE NOT FOUND" +
      "</div>" +

      "<div>" +
      response.employeeId +
      "</div>",

      "error"

    );

  }


  // ===================================
  // UNKNOWN RESPONSE
  // ===================================

  else {

    showResult(

      "⚠️ Unexpected response.",

      "error"

    );

  }


  // ===================================
  // READY FOR NEXT EMPLOYEE
  // ===================================

  setTimeout(

    function() {

      processing = false;


      showResult(

        "📷 Ready — Scan Next Employee",

        "info"

      );

    },

    2000

  );

}


// =====================================
// HANDLE ERROR
// =====================================

function handleError(error) {

  showResult(

    "⚠️ SYSTEM ERROR<br><br>" +
    error.message,

    "error"

  );


  setTimeout(

    function() {

      processing = false;


      showResult(

        "📷 Ready — Scan Next Employee",

        "info"

      );

    },

    2000

  );

}


// =====================================
// START WHEN PAGE LOADS
// =====================================

window.onload = function() {

  startScanner();

};

</script>

</body>
</html>
